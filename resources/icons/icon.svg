<!--
  remotea app icon — master art. Every raster the app ships (icon.png and
  each ICO entry) is drawn from these numbers; regenerate with
  `npm run build:icons` on Windows, or scripts/build-icons-pillow.py in WSL.

  The mark: a terminal split into two panes, and one of the panes is alive.
  The dim pane is the terminal you are looking at; the lit pane is the one
  that keeps running on the other machine. Yellow (#f5c518) is remotea's
  accent; the plate (#15151a) and the dim pane (#3a3a43) are the terminal's
  own greys, kept from the wmux mark so the icon sits with its ancestry.

  Geometry on a 512 grid, chosen so the mark survives the 16px tray entry:
    - plate corner radius 0.241 of the side (kept from the wmux badge)
    - panes 124 wide x 256 tall, corner radius 18, 40 apart, centred
    - the glow is the lit pane grown by 14 and blurred by 22; it is the only
      soft element and it is behind everything, so at 16px it just warms the
      plate around the lit pane rather than turning to mush
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="123.4" ry="123.4" fill="#15151a"/>
  <rect x="262" y="114" width="152" height="284" rx="32" ry="32" fill="#f5c518" opacity="0.55" filter="url(#glow)"/>
  <rect x="112" y="128" width="124" height="256" rx="18" ry="18" fill="#3a3a43"/>
  <rect x="276" y="128" width="124" height="256" rx="18" ry="18" fill="#f5c518"/>
</svg>
