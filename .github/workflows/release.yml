name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.5.6). Leave empty to use current package.json version.'
        required: false

permissions:
  contents: write

jobs:
  build-sign-release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Fix Python distutils for node-gyp
        run: pip install setuptools

      - name: Install dependencies
        run: npm ci

      # ── Gate ───────────────────────────────────────────────
      # A tag push used to go straight from `npm ci` to a published release with
      # no test or typecheck run anywhere in between. 0.35.0 shipped a renderer
      # that threw on first paint for every user (a TDZ read in a useMemo deps
      # array, which `tsc` reports as TS2448 in under two seconds) because
      # nothing here ever asked. Failing the release is the point: a tag that
      # cannot pass its own tests must not become a download.
      - name: Test
        run: npm test

      # ── Build ──────────────────────────────────────────────
      - name: Build main + preload + CLI
        run: npm run build:main

      # resources/cli/*.js is a checked-in copy of this build's output, and
      # nothing kept it in step — it was ~1700 diff lines behind its own source
      # when #168 measured it. Nothing shipped reads it (extraResources maps
      # dist/cli), but dev-mode Claude hook registration does, so a stale copy
      # means dev behaves unlike production for no visible reason.
      #
      # Runs AFTER build:main because that is what makes dist/cli exist; the
      # build-free half of the same invariant (shell-integration) is covered by
      # npm test above, so it gates a release even if this step is ever moved.
      - name: Verify checked-in resources match their sources
        run: npm run verify:resources

      - name: Build renderer
        run: npx vite build

      # The Remote Console fails SILENTLY when its build output is missing: the
      # facade logs `remote-console-missing`, the server answers 503
      # `ui-not-built`, nothing crashes. And the only test that looks at the
      # built phone page skips when dist/renderer does not exist — which is
      # always the case at the `npm test` gate above. So check it here, where
      # it exists, with the skip turned into a failure (#254).
      - name: Verify Remote Console build output
        shell: bash
        env:
          REMOTEA_REQUIRE_BUILD: '1'
        run: |
          test -f dist/renderer/remote-manifest.json
          test -f dist/renderer/remote/index.html
          test -f dist/main/remote-console/runtime.js
          npx vitest run tests/unit/remote-ui-build.test.ts

      # ── Package (NSIS installer) ───────────────────────────
      # Build the NSIS installer so electron-updater can actually install the
      # update on Windows. The previous `--dir` build shipped a zip, which
      # electron-updater's NsisUpdater can download and verify but has no way to
      # install — quitAndInstall() no-ops and the app relaunches unchanged
      # (issue #96). --publish never: we upload manually below so latest.yml is
      # generated AFTER signing (see the note on that step).
      - name: Package with electron-builder
        run: npx electron-builder --win --publish never

      # The same three files, in the artifact that ships: a `files` rule that
      # dropped .json/.html from the asar would pass every check above.
      - name: Verify Remote Console files in the packaged asar
        shell: bash
        run: |
          # asar lists Windows separators with a leading one (\dist\main\...).
          # A here-string, not `echo | grep -q`: under pipefail an early grep
          # exit SIGPIPEs the echo and fails a step that found the file.
          LIST=$(npx asar list release/win-unpacked/resources/app.asar | tr '\\' '/')
          for f in dist/renderer/remote-manifest.json dist/renderer/remote/index.html dist/main/remote-console/runtime.js; do
            grep -qxF -e "/$f" -e "$f" <<< "$LIST" || { echo "missing from app.asar: $f"; exit 1; }
          done

      - name: Extract version
        id: version
        shell: bash
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          # The installer's name comes from electron-builder.json (nsis.artifactName,
          # remotea-<ver>-setup.exe), so a rename there cannot strand the steps below
          # on a file that doesn't exist (they used to look for remotea-<ver>-setup.exe).
          INSTALLER=$(node -p "require('./electron-builder.json').nsis.artifactName.replace('\${version}', '$VER').replace('\${ext}', 'exe')")
          test -f "release/$INSTALLER" || { echo "::error::release/$INSTALLER was not built"; ls release; exit 1; }
          echo "installer=$INSTALLER" >> "$GITHUB_OUTPUT"
          echo "zip=remotea-$VER-win-x64.zip" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$VER" >> "$GITHUB_OUTPUT"
          fi

      # ── Icon + version metadata ────────────────────────────
      # electron-builder embeds win.icon and the package.json version into the
      # packaged exe during the NSIS build above, so the previous manual rcedit
      # pass is no longer needed — it targeted release/win-unpacked/remotea.exe,
      # which is already baked into the installer by the time a separate step
      # could run, so it had no effect on the shipped artifact.

      # ── Portable zip ───────────────────────────────────────
      # Keep shipping the portable zip (remotea-X.Y.Z-win-x64.zip; zip-updater's
      # pickZipAsset looks for "win-x64") alongside the NSIS installer: unsigned
      # zips trip SmartScreen far less than unsigned installers. The NSIS build
      # above still emits release/win-unpacked/ as an intermediate, so this is
      # free. Auto-update (latest.yml) points at the installer, not this zip —
      # a zip can be downloaded but never installed by NsisUpdater (issue #96).
      - name: Create portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path "release/win-unpacked/*" `
            -DestinationPath "${{ steps.version.outputs.zip }}"

      # ── Generate latest.yml for electron-updater ──────────
      # ALWAYS published. The `win.publisherName` pin was removed from
      # electron-builder.json: with no pin, NsisUpdater skips Authenticode
      # verification, so unsigned/self-signed installers install fine —
      # integrity comes from the sha512 below, and the client-side quarantine
      # window + explicit install dialog (updater.ts) remain the safety net.
      # History: while the pin existed, latest.yml was gated on a chain-trusted
      # signature; since SignPath fell back to a self-signed cert, that gate
      # silently stranded every install on its current version (no latest.yml
      # → 404 → no update ever). If chain-trusted signing returns, re-add the
      # pin AND re-gate this step together.
      # Installs ≤0.31 still carry the pin in their local app-update.yml and
      # will fail verification silently; the notify-only checker
      # (update-checker.ts) tells those users to update manually once.
      #
      # MUST run after anything that rewrites the installer (signing, if it is
      # ever added back), or the hash would not match the shipped file. Points at the
      # NSIS installer (a zip can be downloaded but never installed — issue
      # #96). No blockmap is emitted, so electron-updater does a full
      # (non-differential) download verified by the top-level sha512.
      - name: Generate latest.yml
        shell: bash
        run: |
          node -e "
            const crypto = require('crypto');
            const fs = require('fs');
            const version = '${{ steps.version.outputs.version }}';
            const installer = '${{ steps.version.outputs.installer }}';
            const data = fs.readFileSync('release/' + installer);
            const sha512 = crypto.createHash('sha512').update(data).digest('base64');
            const size = data.length;
            const date = new Date().toISOString();
            const yaml = [
              'version: ' + version,
              'files:',
              '  - url: ' + installer,
              '    sha512: ' + sha512,
              '    size: ' + size,
              'path: ' + installer,
              'sha512: ' + sha512,
              \"releaseDate: '\" + date + \"'\",
              ''
            ].join('\n');
            fs.writeFileSync('latest.yml', yaml);
            console.log('latest.yml generated for', installer, 'size=' + size, 'sha512=' + sha512.substring(0, 20) + '...');
          "

      - name: Upload release artifacts as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: remotea-release
          path: |
            release/${{ steps.version.outputs.installer }}
            ${{ steps.version.outputs.zip }}
            latest.yml

      # ── GitHub Release ─────────────────────────────────────
      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: remotea ${{ steps.version.outputs.tag }}
          files: |
            release/${{ steps.version.outputs.installer }}
            ${{ steps.version.outputs.zip }}
            latest.yml
          draft: false
          generate_release_notes: true
